<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEMO</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sen:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Put your two images next to this file: bg.jpg (group photo) and logo.png (CEMO logo) */
  :root{
    --card:#050631; --white:#fff; --btn:#f4f4fb; --ink:#050631;
    --bg-image:url('back.png');
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Sen',sans-serif;color:var(--white);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px 12px;
    background:linear-gradient(rgba(52,72,138,.72),rgba(52,72,138,.72)),var(--bg-image),#3a4a82;
    background-size:cover;background-position:center;background-attachment:fixed;
  }
  .card{
    background:var(--card);border-radius:100px;display:none;flex-direction:column;align-items:center;
    width:100%;text-align:center;
  }
  .card.active{display:flex}
  #login{max-width:615px;min-height:792px;padding:36px 0 40px;border-radius:90px}
  #register{max-width:719px;min-height:926px;padding:34px 0 50px;border-radius:100px}

  .logo{height:auto;display:block}
  #register .logo{width:230px;margin-top:0}
  #login .logo{width:250px;margin-top:0}
  .logo-fallback{display:none;flex-direction:column;align-items:center;line-height:1}
  .logo-fallback b{font:800 58px 'Sen',sans-serif;letter-spacing:1px}
  .logo-fallback small{font-size:10px;margin-top:6px}
  .logo-wrap.no-img img{display:none}
  .logo-wrap.no-img .logo-fallback{display:flex}

  h1{
    font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:84px;line-height:1;letter-spacing:0;
    text-shadow:0 0 6px #fff,0 0 18px rgba(255,255,255,.7),0 0 34px rgba(255,255,255,.4);
  }
  #register h1{margin-top:26px}
  #login h1{margin-top:34px}

  form{width:100%;display:flex;flex-direction:column;align-items:center}
  #register form{margin-top:34px}
  #login form{margin-top:46px}

  .grid{display:grid;grid-template-columns:252px 252px;column-gap:79px;row-gap:19px;justify-content:center}
  .single{display:flex;flex-direction:column;gap:15px;width:355px;max-width:86%}

  .field{position:relative}
  input,select{
    width:100%;height:54px;background:transparent;color:var(--white);
    border:1.5px solid var(--white);border-radius:18px;padding:0 20px;
    font:400 20px 'Sen',sans-serif;outline:none;appearance:none;-webkit-appearance:none;
    transition:box-shadow .2s;
  }
  .single input{height:58px;padding:0 22px}
  input::placeholder{color:var(--white);opacity:1}
  input:focus,select:focus{box-shadow:0 0 10px rgba(255,255,255,.6)}
  select{cursor:pointer;padding-right:44px}
  select option{background:var(--card);color:var(--white)}
  .arrow{position:absolute;right:20px;top:50%;transform:translateY(-50%);pointer-events:none;width:12px;height:20px}
  .invalid{border-color:#ff7b7b!important}

  .btn{
    background:var(--btn);color:var(--ink);border:1.5px solid #fff;border-radius:18px;
    width:158px;height:52px;font:700 22px 'Sen',sans-serif;cursor:pointer;transition:transform .15s,box-shadow .15s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 0 14px rgba(255,255,255,.55)}
  #register .btn{margin-top:50px}
  #login .btn{margin-top:30px}

  .links{display:flex;flex-direction:column;align-items:center;gap:2px}
  #login .links{margin-top:32px}
  #register .links{margin-top:54px}
  .links a{color:var(--white);font-size:21px;line-height:1.1;text-decoration:underline;cursor:pointer}

  .msg{min-height:20px;margin-top:14px;font-size:15px;color:#ffb4b4;padding:0 20px}
  .msg.ok{color:#9ff0b5}

  /* Tablets */
  @media (max-width:820px){
    h1{font-size:68px}
    .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:28px;width:86%}
    #register{border-radius:80px}
  }
  /* Phones */
  @media (max-width:560px){
    #login,#register{border-radius:56px;min-height:0;padding:30px 0 40px}
    #register .logo,#login .logo{width:190px}
    h1{font-size:56px}
    .grid{grid-template-columns:1fr;width:80%;row-gap:14px}
    input,select{font-size:18px;height:50px}
    .single input{height:52px}
    .links a{font-size:19px}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<section class="card" id="login" aria-label="Login">
  <div class="logo-wrap">
    <img class="logo" src="logo.png" alt="CEMO - Conseil des Étudiants en Médecine d'Oujda">
    <div class="logo-fallback"><b>CEMO</b><small>CONSEIL DES ÉTUDIANTS EN MÉDECINE D'OUJDA</small></div>
  </div>
  <h1>LOGIN</h1>
  <form id="loginForm" novalidate>
    <div class="single">
      <input type="text" name="login" placeholder="Login" autocomplete="username">
      <input type="password" name="password" placeholder="Passsword" autocomplete="current-password">
    </div>
    <button class="btn" type="submit">Login</button>
    <div class="msg" id="loginMsg" role="alert"></div>
  </form>
  <div class="links" style="margin-top:6px">
    <a href="#forgot" id="forgot">Forgot password ?</a>
    <a href="#register">Register</a>
  </div>
</section>

<!-- REGISTER -->
<section class="card" id="register" aria-label="Register">
  <div class="logo-wrap">
    <img class="logo" src="logo.png" alt="CEMO - Conseil des Étudiants en Médecine d'Oujda">
    <div class="logo-fallback"><b>CEMO</b><small>CONSEIL DES ÉTUDIANTS EN MÉDECINE D'OUJDA</small></div>
  </div>
  <h1>REGISTER</h1>
  <form id="registerForm" novalidate>
    <div class="grid">
      <input type="text" name="name" placeholder="name" autocomplete="given-name">
      <input type="text" name="surname" placeholder="surname" autocomplete="family-name">
      <input type="text" name="apogee" placeholder="apogee" inputmode="numeric">
      <input type="tel" name="phone" placeholder="phone number" autocomplete="tel">
      <input type="email" name="email" placeholder="email" autocomplete="email">
      <div class="field">
        <select name="year">
          <option value="" selected disabled hidden>year</option>
          <option>1st year</option><option>2nd year</option><option>3rd year</option>
          <option>4th year</option><option>5th year</option><option>6th year</option><option>7th year</option>
        </select>
        <svg class="arrow" viewBox="0 0 12 20" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7l4-4 4 4M2 13l4 4 4-4"/></svg>
      </div>
      <input type="password" name="password" placeholder="Passsword" autocomplete="new-password">
      <input type="password" name="confirm" placeholder="Confirm Passsword" autocomplete="new-password">
    </div>
    <button class="btn" type="submit">register</button>
    <div class="msg" id="registerMsg" role="alert"></div>
  </form>
  <div class="links" style="margin-top:8px"><a href="#login">Login</a></div>
</section>

<script>
(function(){
  const pages = {login:document.getElementById('login'), register:document.getElementById('register')};

  // Navigation (hash based, no reload)
  function show(){
    const key = location.hash === '#register' ? 'register' : 'login';
    Object.entries(pages).forEach(([k,el]) => el.classList.toggle('active', k===key));
    document.title = 'CEMO - ' + (key === 'register' ? 'Register' : 'Login');
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', show);
  show();

  // Logo fallback if logo.png is missing
  document.querySelectorAll('.logo').forEach(img => {
    img.addEventListener('error', () => img.parentElement.classList.add('no-img'));
  });

  const setMsg = (el, text, ok) => { el.textContent = text; el.classList.toggle('ok', !!ok); };
  const mark = (input, bad) => input.classList.toggle('invalid', bad);

  // Login
  const lf = document.getElementById('loginForm'), lm = document.getElementById('loginMsg');
  lf.addEventListener('submit', e => {
    e.preventDefault();
    const l = lf.login, p = lf.password;
    mark(l, !l.value.trim()); mark(p, !p.value);
    if (!l.value.trim() || !p.value) return setMsg(lm, 'Please enter your login and password.');
    setMsg(lm, 'Logging in…', true);
    // TODO: replace with your real authentication request
    lf.dispatchEvent(new CustomEvent('cemo:login', {bubbles:true, detail:{login:l.value.trim(), password:p.value}}));
  });
  document.getElementById('forgot').addEventListener('click', e => {
    e.preventDefault();
    setMsg(lm, 'Password reset: please contact the CEMO administrators.', true);
  });

  // Register
  const rf = document.getElementById('registerForm'), rm = document.getElementById('registerMsg');
  rf.addEventListener('submit', e => {
    e.preventDefault();
    const f = rf.elements, errors = [];
    const check = (el, bad, msg) => { mark(el, bad); if (bad) errors.push(msg); };
    check(f.name, !f.name.value.trim(), 'Name is required.');
    check(f.surname, !f.surname.value.trim(), 'Surname is required.');
    check(f.apogee, !/^\d{6,10}$/.test(f.apogee.value.trim()), 'Apogee must be 6–10 digits.');
    check(f.phone, !/^(\+212|0)[5-7]\d{8}$/.test(f.phone.value.replace(/[\s.-]/g,'')), 'Enter a valid phone number.');
    check(f.email, !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.value.trim()), 'Enter a valid email.');
    check(f.year, !f.year.value, 'Select your year.');
    check(f.password, f.password.value.length < 8, 'Password needs at least 8 characters.');
    check(f.confirm, f.confirm.value !== f.password.value || !f.confirm.value, 'Passwords do not match.');
    if (errors.length) return setMsg(rm, errors[0]);
    setMsg(rm, 'Registration submitted.', true);
    // TODO: replace with your real registration request
    rf.dispatchEvent(new CustomEvent('cemo:register', {bubbles:true, detail:Object.fromEntries(new FormData(rf))}));
  });

  document.querySelectorAll('input,select').forEach(el =>
    el.addEventListener('input', () => el.classList.remove('invalid')));
})();
</script>
</body>
</html>
